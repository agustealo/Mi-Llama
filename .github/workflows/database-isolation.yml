name: Database Isolation Gate

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-isolation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-isolation.yml"

permissions:
  contents: read

concurrency:
  group: database-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Verify pinned CLI
        run: supabase --version

      - name: Start local Supabase stack
        run: supabase start

      - name: Run database isolation tests
        run: supabase test db

      - name: Run Storage API revocation burn
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          set -a
          source "$RUNNER_TEMP/supabase-local.env"
          set +a
          python supabase/tests/source_cleanup_storage_api.py
          rm -f "$RUNNER_TEMP/supabase-local.env"

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true
