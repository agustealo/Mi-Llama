name: Patch writing model availability

on:
  push:
    branches:
      - ux/writing-model-availability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/writing-model-availability
          fetch-depth: 1
      - name: Patch consumer model availability states
        run: |
          python - <<'PY'
          from pathlib import Path

          studio_path = Path('src/mi_llama/workspace_assets/studio.js')
          studio = studio_path.read_text()

          replacements = [
              (
                  "  const attention = saveAttentionVisible()\n",
                  "  const attention = saveAttentionVisible()\n  const writingAvailable = Boolean(state.model)\n",
              ),
              (
                  "        <label class=\"field-label\">Model<select id=\"studio-model\"></select></label>\n",
                  "        <label class=\"field-label\">Writing model<select id=\"studio-model\"></select></label>\n",
              ),
              (
                  "        <div class=\"collaborator-callout\">\n          <b>Select before you ask.</b>\n          <p>Mi-Llama works only with the passage you selected and the saved manuscript you reviewed.</p>\n        </div>\n",
                  "        <div class=\"collaborator-callout\">\n          <b>${writingAvailable ? 'Select before you ask.' : 'Writing assistance is unavailable.'}</b>\n          <p>${writingAvailable ? 'Mi-Llama works only with the passage you selected and the saved manuscript you reviewed.' : 'You can keep writing and saving normally. AI editing will return when a writing model is available.'}</p>\n        </div>\n",
              ),
              (
                  "        <button id=\"custom-proposal\" class=\"secondary collaborator-ask\"${state.canEdit ? '' : ' disabled'}>Ask Mi-Llama about selection</button>\n",
                  "        <button id=\"custom-proposal\" class=\"secondary collaborator-ask\"${state.canEdit && writingAvailable ? '' : ' disabled'}>Ask Mi-Llama about selection</button>\n",
              ),
              (
                  "    option.textContent = 'No Ollama models available'\n",
                  "    option.textContent = 'Writing assistance unavailable'\n",
              ),
              (
                  "  toolbar.hidden = !selection.text.trim() || !state.canEdit || state.conflict || Boolean(state.saveError)\n",
                  "  toolbar.hidden = !selection.text.trim() || !state.model || !state.canEdit || state.conflict || Boolean(state.saveError)\n",
              ),
              (
                  "    showError('No Ollama model is available for writing proposals.')\n",
                  "    showError('Writing assistance is unavailable right now. You can keep writing and saving normally.')\n",
              ),
          ]

          for old, new in replacements:
              count = studio.count(old)
              if count == 0:
                  if new in studio:
                      continue
                  raise SystemExit(f'missing expected studio.js patch target: {old[:120]!r}')
              if count != 1:
                  raise SystemExit(f'non-unique studio.js patch target ({count}): {old[:120]!r}')
              studio = studio.replace(old, new, 1)

          studio_path.write_text(studio)

          tests_path = Path('tests/test_workspace_consumer_language.py')
          tests = tests_path.read_text()
          marker = "\n\ndef test_workspace_shell_keeps_navigation_and_health_contracts() -> None:\n"
          addition = '''

          def test_writing_model_availability_is_capability_facing() -> None:
              studio = (ASSETS / "studio.js").read_text()

              assert "Writing model<select id=\"studio-model\"" in studio
              assert "Writing assistance unavailable" in studio
              assert "AI editing will return when a writing model is available." in studio
              assert "state.canEdit && writingAvailable" in studio
              assert "!selection.text.trim() || !state.model || !state.canEdit" in studio
              assert "Writing assistance is unavailable right now." in studio
              for phrase in (
                  "No Ollama models available",
                  "No Ollama model is available for writing proposals.",
              ):
                  assert phrase not in studio
          '''
          if 'def test_writing_model_availability_is_capability_facing' not in tests:
              if marker not in tests:
                  raise SystemExit('consumer-language test insertion marker missing')
              tests = tests.replace(marker, addition + marker, 1)
              tests_path.write_text(tests)
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- src/mi_llama/workspace_assets/studio.js tests/test_workspace_consumer_language.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mi_llama/workspace_assets/studio.js tests/test_workspace_consumer_language.py
          git commit -m "Surface writing model availability as a product capability"
          git push origin HEAD:ux/writing-model-availability
