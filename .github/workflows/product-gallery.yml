name: Product Gallery

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "web/editor/**"
      - "src/mi_llama/workspace.py"
      - "src/mi_llama/workspace_assets/**"
      - "docs/capture_screenshots.py"
      - "docs/assets/screenshots/**"
      - "pyproject.toml"
      - ".github/workflows/product-gallery.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "web/editor/**"
      - "src/mi_llama/workspace.py"
      - "src/mi_llama/workspace_assets/**"
      - "docs/capture_screenshots.py"
      - "docs/assets/screenshots/**"
      - "pyproject.toml"
      - ".github/workflows/product-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-gallery-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked editor bundle
        run: |
          npm ci
          npm run test:editor
          npm run build:editor
          git diff --exit-code -- src/mi_llama/workspace_assets/tiptap_editor.bundle.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build and install the shipped wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl playwright
          python - <<'PY'
          from pathlib import Path
          import mi_llama.workspace as workspace

          assets = Path(workspace.__file__).with_name("workspace_assets")
          required = {
              "index.html",
              "app.css",
              "app.js",
              "auth.js",
              "canonical_editor_state.js",
              "editor_adapter.js",
              "tiptap_adapter.js",
              "tiptap_editor.bundle.js",
              "studio.css",
              "studio.js",
              "rich_editor.css",
              "rich_editor_activation.js",
              "studio_research.css",
              "studio_research.js",
              "studio_citations.css",
              "studio_citations.js",
              "studio_intelligence.css",
              "studio_intelligence.js",
              "mi-llama-mark.svg",
          }
          present = {path.name for path in assets.iterdir()} if assets.is_dir() else set()
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"installed wheel is missing workspace assets: {missing}")
          print(f"installed workspace assets: {assets}")
          PY
          python -m playwright install --with-deps chromium

      - name: Start packaged Mi-Llama workspace
        env:
          MI_LLAMA_HOST: 127.0.0.1
          MI_LLAMA_PORT: 8765
          MI_LLAMA_SUPABASE_URL: https://example.supabase.co
          MI_LLAMA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_docs_capture
          MI_LLAMA_OLLAMA_BASE_URL: http://127.0.0.1:11434
          MI_LLAMA_MINDSDB_ENABLED: "false"
        run: |
          mi-llama > /tmp/mi-llama.log 2>&1 &
          echo $! > /tmp/mi-llama.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mi-llama.log
          exit 1

      - name: Capture six real product screens
        run: python docs/capture_screenshots.py

      - name: Upload generated gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-llama-product-gallery-${{ github.sha }}
          path: docs/assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed gallery matches the product
        run: |
          if ! git diff --exit-code -- docs/assets/screenshots; then
            echo "::error::Product screenshots are stale. Download the generated gallery artifact and commit the refreshed PNGs."
            exit 1
          fi

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mi-llama.log || true

      - name: Stop workspace
        if: always()
        run: |
          if [ -f /tmp/mi-llama.pid ]; then
            kill "$(cat /tmp/mi-llama.pid)" 2>/dev/null || true
          fi