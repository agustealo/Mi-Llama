name: Patch actionable empty states

on:
  push:
    branches:
      - ux/actionable-empty-states

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/actionable-empty-states
      - name: Patch static shell actions
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/mi_llama/workspace_assets/app.js')
          app = app_path.read_text()
          replacements = {
              "'<button class=\"secondary\">Project settings</button><button class=\"primary\">Continue writing</button>'": "'<button class=\"primary\" data-view-target=\"manuscript\">Continue writing</button>'",
              "'<button class=\"secondary\">Filter</button><button class=\"primary\">Upload source</button>'": "''",
              "'<button class=\"secondary\">Research gaps</button><button class=\"primary\">New question</button>'": "''",
              "'<button class=\"secondary\">Sort</button><button class=\"primary\">New note</button>'": "''",
              "'<button class=\"secondary\">Review history</button><button class=\"primary\">Review manuscript</button>'": "'<button class=\"primary\" data-view-target=\"manuscript\">Open manuscript</button>'",
          }
          for old, new in replacements.items():
              if old not in app:
                  raise SystemExit(f'missing app replacement: {old}')
              app = app.replace(old, new, 1)
          marker = "addEventListener('hashchange', render)\nrender()\n"
          nav = """addEventListener('click', (event) => {\n  const target = event.target instanceof Element ? event.target.closest('[data-view-target]') : null\n  if (!target) return\n  const view = target.dataset.viewTarget\n  if (views.some((candidate) => candidate.id === view)) location.hash = view\n})\n\n"""
          if nav not in app:
              if marker not in app:
                  raise SystemExit('render marker missing')
              app = app.replace(marker, nav + marker, 1)
          app_path.write_text(app)

          research_path = Path('src/mi_llama/workspace_assets/studio_research.js')
          research = research_path.read_text()
          research = research.replace(
              'Select an available Ollama model before generating a source-backed edit.',
              'Select an available writing model before generating a source-backed edit.',
          )
          research_path.write_text(research)

          test_path = Path('tests/test_workspace_consumer_language.py')
          tests = test_path.read_text()
          block = '''\n\ndef test_static_shell_actions_are_owned_or_removed() -> None:\n    app = (ASSETS / "app.js").read_text()\n\n    assert 'data-view-target="manuscript">Continue writing' in app\n    assert 'data-view-target="manuscript">Open manuscript' in app\n    assert "closest('[data-view-target]')" in app\n    assert "location.hash = view" in app\n    for dead_label in (\n        "Project settings",\n        "Upload source",\n        "Research gaps",\n        "New question",\n        "New note",\n        "Review history",\n    ):\n        assert f">{dead_label}<" not in app\n\n\ndef test_source_backed_generation_uses_capability_language() -> None:\n    research = (ASSETS / "studio_research.js").read_text()\n\n    assert "Select an available writing model before generating a source-backed edit." in research\n    assert "Select an available Ollama model before generating a source-backed edit." not in research\n'''
          if 'def test_static_shell_actions_are_owned_or_removed()' not in tests:
              tests += block
          test_path.write_text(tests)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mi_llama/workspace_assets/app.js src/mi_llama/workspace_assets/studio_research.js tests/test_workspace_consumer_language.py
          git commit -m "Make first-use shell actions honest and actionable"
          git push origin HEAD:ux/actionable-empty-states
