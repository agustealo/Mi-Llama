name: Patch shared sign-in unavailable contract

on:
  push:
    branches:
      - ux/shared-sign-in-unavailable

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/shared-sign-in-unavailable
          fetch-depth: 1
      - name: Consolidate sign-in unavailable fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          assets = Path('src/mi_llama/workspace_assets')
          auth_path = assets / 'auth.js'
          auth = auth_path.read_text()
          marker = "const REFRESH_SKEW_SECONDS = 60\n"
          shared = "export const SIGN_IN_UNAVAILABLE = 'Sign-in is unavailable in this workspace.'\n"
          if shared not in auth:
              if marker not in auth:
                  raise SystemExit('auth marker missing')
              auth = auth.replace(marker, marker + shared, 1)
          auth_path.write_text(auth)

          studio_path = assets / 'studio.js'
          studio = studio_path.read_text()
          studio = studio.replace(
              "import { apiErrorMessage, AuthClient, AuthError } from './auth.js'",
              "import { apiErrorMessage, AuthClient, AuthError, SIGN_IN_UNAVAILABLE } from './auth.js'",
              1,
          )
          studio = studio.replace("const SIGN_IN_UNAVAILABLE = 'Sign-in is unavailable in this workspace.'\n", '', 1)
          studio_path.write_text(studio)

          for filename in ('studio_research.js', 'studio_citations.js', 'studio_intelligence.js'):
              path = assets / filename
              text = path.read_text()
              text = text.replace(
                  "import { AuthClient, AuthError } from './auth.js'",
                  "import { AuthClient, AuthError, SIGN_IN_UNAVAILABLE } from './auth.js'",
                  1,
              )
              text = text.replace(
                  "new AuthError('Authentication is not configured', 503)",
                  "new AuthError(SIGN_IN_UNAVAILABLE, 503)",
              )
              if "Authentication is not configured" in text:
                  raise SystemExit(f'legacy auth fallback remains in {filename}')
              path.write_text(text)

          tests_path = Path('tests/test_workspace_consumer_language.py')
          tests = tests_path.read_text()
          anchor = 'def test_writing_model_availability_is_capability_facing() -> None:\n'
          block = '''def test_feature_modules_share_sign_in_unavailable_contract() -> None:\n    auth = (ASSETS / "auth.js").read_text()\n    studio = (ASSETS / "studio.js").read_text()\n\n    assert "export const SIGN_IN_UNAVAILABLE = 'Sign-in is unavailable in this workspace.'" in auth\n    assert "const SIGN_IN_UNAVAILABLE =" not in studio\n    assert "SIGN_IN_UNAVAILABLE" in studio\n    for filename in ("studio_research.js", "studio_citations.js", "studio_intelligence.js"):\n        module = (ASSETS / filename).read_text()\n        assert "SIGN_IN_UNAVAILABLE" in module\n        assert "Authentication is not configured" not in module\n        assert "new AuthError(SIGN_IN_UNAVAILABLE, 503)" in module\n\n\n'''
          if block not in tests:
              if anchor not in tests:
                  raise SystemExit('test anchor missing')
              tests = tests.replace(anchor, block + anchor, 1)
          tests_path.write_text(tests)
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- src/mi_llama/workspace_assets/auth.js src/mi_llama/workspace_assets/studio.js src/mi_llama/workspace_assets/studio_research.js src/mi_llama/workspace_assets/studio_citations.js src/mi_llama/workspace_assets/studio_intelligence.js tests/test_workspace_consumer_language.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mi_llama/workspace_assets/auth.js src/mi_llama/workspace_assets/studio.js src/mi_llama/workspace_assets/studio_research.js src/mi_llama/workspace_assets/studio_citations.js src/mi_llama/workspace_assets/studio_intelligence.js tests/test_workspace_consumer_language.py
          git commit -m "Centralize sign-in unavailable fallback"
          git push origin HEAD:ux/shared-sign-in-unavailable
