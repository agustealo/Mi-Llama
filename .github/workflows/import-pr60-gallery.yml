name: Import PR 60 governed gallery

on:
  push:
    branches:
      - ux/project-aware-surfaces

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/project-aware-surfaces
          fetch-depth: 0
      - name: Download exact governed gallery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/agustealo/Mi-Llama/actions/artifacts/11001724443/zip" \
            --output /tmp/gallery.zip
          rm -rf /tmp/gallery
          mkdir -p /tmp/gallery
          unzip -q /tmp/gallery.zip -d /tmp/gallery
          find /tmp/gallery -type f -name '*.png' -print
          cp /tmp/gallery/*.png docs/assets/screenshots/
      - name: Commit governed screenshots and remove importer
        run: |
          rm .github/workflows/import-pr60-gallery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/screenshots .github/workflows/import-pr60-gallery.yml
          git commit -m "Refresh governed project-aware product gallery"
          git push origin HEAD:ux/project-aware-surfaces
