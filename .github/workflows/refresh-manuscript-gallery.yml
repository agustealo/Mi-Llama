name: Refresh Manuscript Gallery

on:
  push:
    branches:
      - ux/manuscript-writer-language
    paths:
      - .gallery-refresh

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ux/manuscript-writer-language

      - name: Download governed gallery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/mi-llama-gallery
          mkdir -p /tmp/mi-llama-gallery
          gh run download 36434505279 \
            --repo agustealo/Mi-Llama \
            --name mi-llama-product-gallery-d241a47973ffdc389931b1097f8c7de2eaef578a \
            --dir /tmp/mi-llama-gallery
          test -f /tmp/mi-llama-gallery/05-manuscript.png

      - name: Commit refreshed manuscript screenshot and remove helper
        run: |
          cp /tmp/mi-llama-gallery/05-manuscript.png docs/assets/screenshots/05-manuscript.png
          git rm .gallery-refresh .github/workflows/refresh-manuscript-gallery.yml
          git add docs/assets/screenshots/05-manuscript.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh manuscript product screenshot"
          git push origin HEAD:ux/manuscript-writer-language
