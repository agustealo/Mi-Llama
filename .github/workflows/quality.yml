name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Workspace JavaScript syntax
        run: |
          node --check src/mi_llama/workspace_assets/app.js
          node --check src/mi_llama/workspace_assets/auth.js
          node --check src/mi_llama/workspace_assets/studio.js
          node --check src/mi_llama/workspace_assets/studio_research.js
          node --check src/mi_llama/workspace_assets/studio_citations.js

      - name: MyPy
        run: mypy src/mi_llama

      - name: Tests
        run: pytest
