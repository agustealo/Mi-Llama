name: Activation Maintenance

on:
  push:
    branches:
      - feat/activate-tiptap-manuscript-editor-v2
    paths:
      - scripts/activate_tiptap_studio_patch.py
      - .github/workflows/activation-maintenance.yml

permissions:
  contents: write

jobs:
  patch-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activate-tiptap-manuscript-editor-v2
          fetch-depth: 0
      - name: Apply surgical studio controller patch
        run: python scripts/activate_tiptap_studio_patch.py
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit product-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve rich editor state through studio autosave"
          git push origin HEAD:feat/activate-tiptap-manuscript-editor-v2
