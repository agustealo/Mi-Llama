name: Refresh governed consumer gallery

on:
  push:
    branches:
      - ux/workspace-consumer-language
    paths:
      - .github/workflows/refresh-consumer-gallery.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/workspace-consumer-language
      - name: Download exact-head governed gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10980725915/zip > /tmp/gallery.zip
          rm -rf /tmp/gallery
          mkdir -p /tmp/gallery
          unzip -q /tmp/gallery.zip -d /tmp/gallery
          cp /tmp/gallery/*.png docs/assets/screenshots/
      - name: Commit gallery and remove helper
        run: |
          rm .github/workflows/refresh-consumer-gallery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/assets/screenshots .github/workflows/refresh-consumer-gallery.yml
          git commit -m "Refresh governed consumer gallery"
          git push origin HEAD:ux/workspace-consumer-language
