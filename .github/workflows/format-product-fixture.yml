name: Format product fixture

on:
  push:
    branches: [e2e/authenticated-product-fixture]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2e/authenticated-product-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff>=0.12,<1'
      - name: Format and clean helper
        run: |
          ruff format docs/product_fixture_server.py
          rm .github/workflows/format-product-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product_fixture_server.py .github/workflows/format-product-fixture.yml
          git commit -m 'Format authenticated product fixture'
          git push origin HEAD:e2e/authenticated-product-fixture
