name: Use canonical workspace factory

on:
  push:
    branches: [e2e/authenticated-product-fixture]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2e/authenticated-product-fixture
      - name: Patch fixture composition and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/product_fixture_server.py')
          text = path.read_text()
          text = text.replace(
              'from mi_llama.main import create_app as create_api_app\n',
              '',
          )
          text = text.replace(
              'from mi_llama.workspace import attach_workspace\n',
              'from mi_llama.workspace import create_app as create_workspace_app\n',
          )
          old = '''    app = create_api_app(\n        settings=settings,\n        provider=FixtureProvider(),\n        repository=FixtureRepository(),\n        storage=FixtureStorage(),\n        research_engine=None,\n    )\n    return attach_workspace(app)\n'''
          new = '''    return create_workspace_app(\n        settings=settings,\n        provider=FixtureProvider(),\n        repository=FixtureRepository(),\n        storage=FixtureStorage(),\n        research_engine=None,\n    )\n'''
          if old not in text:
              raise SystemExit('fixture build_app block not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/use-canonical-workspace-factory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product_fixture_server.py .github/workflows/use-canonical-workspace-factory.yml
          git commit -m 'Use canonical workspace factory in product fixture'
          git push origin HEAD:e2e/authenticated-product-fixture
