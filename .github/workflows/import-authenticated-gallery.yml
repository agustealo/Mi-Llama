name: Import authenticated product gallery

on:
  push:
    branches: [e2e/authenticated-product-fixture]

permissions:
  actions: read
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2e/authenticated-product-fixture
          fetch-depth: 0
      - name: Import exact governed gallery and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/agustealo/Mi-Llama/actions/artifacts/11003891305/zip > /tmp/gallery.zip
          rm -rf /tmp/gallery
          mkdir -p /tmp/gallery
          unzip -q /tmp/gallery.zip -d /tmp/gallery
          cp /tmp/gallery/*.png docs/assets/screenshots/
          rm .github/workflows/import-authenticated-gallery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/screenshots .github/workflows/import-authenticated-gallery.yml
          git commit -m 'Refresh authenticated product gallery'
          git push origin HEAD:e2e/authenticated-product-fixture
