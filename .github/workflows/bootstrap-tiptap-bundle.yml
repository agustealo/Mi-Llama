name: Bootstrap Tiptap bundle

on:
  push:
    branches: [feat/tiptap-manuscript-editor]
    paths:
      - package.json
      - web/editor/tiptap_runtime.js
      - .github/workflows/bootstrap-tiptap-bundle.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked editor dependencies
        run: npm install --ignore-scripts=false

      - name: Build local Tiptap browser bundle
        run: npm run build:editor

      - name: Commit generated lockfile and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/mi_llama/workspace_assets/tiptap_editor.bundle.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build locked Tiptap browser bundle"
          git push origin HEAD:${{ github.ref_name }}
