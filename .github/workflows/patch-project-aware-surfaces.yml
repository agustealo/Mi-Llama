          git add src/mi_llama/workspace_assets/studio.js src/mi_llama/workspace_assets/auth.js tests/test_workspace_consumer_language.py .github/workflows/patch-project-aware-surfaces.yml
          git commit -m "Wire live project-aware workspace surfaces"
