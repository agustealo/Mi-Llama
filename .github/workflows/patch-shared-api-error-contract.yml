name: Patch shared API error contract

on:
  push:
    branches:
      - ux/shared-api-error-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/shared-api-error-contract
          fetch-depth: 1
      - name: Consolidate API error translation
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/mi_llama/workspace_assets/auth.js')
          auth = auth_path.read_text()
          marker = "export class AuthClient {\n"
          translator = (
              "export function apiErrorMessage(status) {\n"
              "  if (status === 401) return 'Your session has ended. Sign in again.'\n"
              "  if (status === 403) return 'You do not have access to do that in this project.'\n"
              "  if (status === 404) return 'That item is no longer available. Refresh and try again.'\n"
              "  if (status === 409) return 'This changed since you opened it. Review the latest version and try again.'\n"
              "  if (status === 413) return 'That item is too large to process here.'\n"
              "  if (status === 422) return 'Some of the information needs attention before this can continue.'\n"
              "  if (status === 429) return 'Too many requests right now. Try again shortly.'\n"
              "  if (status >= 500) return 'Mi-Llama could not complete that right now. Try again shortly.'\n"
              "  return 'Mi-Llama could not complete that request. Check your work and try again.'\n"
              "}\n\n"
          )
          if 'export function apiErrorMessage(status)' not in auth:
              if marker not in auth:
                  raise SystemExit('AuthClient marker missing')
              auth = auth.replace(marker, translator + marker, 1)
          old_api = "      throw new AuthError(await responseError(response, `Request failed (${response.status})`), response.status)"
          new_api = "      await response.text()\n      throw new AuthError(apiErrorMessage(response.status), response.status)"
          if old_api in auth:
              auth = auth.replace(old_api, new_api, 1)
          elif new_api not in auth:
              raise SystemExit('AuthClient apiJson target missing')
          auth_path.write_text(auth)

          studio_path = Path('src/mi_llama/workspace_assets/studio.js')
          studio = studio_path.read_text()
          studio = studio.replace(
              "import { AuthClient, AuthError } from './auth.js'",
              "import { apiErrorMessage, AuthClient, AuthError } from './auth.js'",
              1,
          )
          start = studio.find("function apiErrorMessage(status) {\n")
          if start >= 0:
              end = studio.find("\n}\n\nasync function apiJson", start)
              if end < 0:
                  raise SystemExit('studio translator end missing')
              studio = studio[:start] + studio[end + 3:]
          if "import { apiErrorMessage, AuthClient, AuthError } from './auth.js'" not in studio:
              raise SystemExit('studio import update missing')
          studio_path.write_text(studio)

          tests_path = Path('tests/test_workspace_consumer_language.py')
          tests = tests_path.read_text()
          old = (
              'def test_api_errors_are_translated_before_reaching_writer_flows() -> None:\n'
              '    studio = (ASSETS / "studio.js").read_text()\n\n'
              '    assert "function apiErrorMessage(status)" in studio\n'
          )
          new = (
              'def test_api_errors_are_translated_before_reaching_writer_flows() -> None:\n'
              '    auth = (ASSETS / "auth.js").read_text()\n'
              '    studio = (ASSETS / "studio.js").read_text()\n\n'
              '    assert "export function apiErrorMessage(status)" in auth\n'
              '    assert "function apiErrorMessage(status)" not in studio\n'
              '    assert "apiErrorMessage(response.status)" in auth\n'
              '    assert "apiErrorMessage, AuthClient, AuthError" in studio\n'
          )
          if old in tests:
              tests = tests.replace(old, new, 1)
          elif 'auth = (ASSETS / "auth.js").read_text()' not in tests:
              raise SystemExit('test update target missing')
          tests = tests.replace('    assert "payload?.detail" not in studio\n', '    assert "Request failed (${response.status})" not in auth\n    assert "payload?.detail" not in studio\n', 1)
          tests_path.write_text(tests)
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- src/mi_llama/workspace_assets/auth.js src/mi_llama/workspace_assets/studio.js tests/test_workspace_consumer_language.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mi_llama/workspace_assets/auth.js src/mi_llama/workspace_assets/studio.js tests/test_workspace_consumer_language.py
          git commit -m "Centralize writer-safe API error translation"
          git push origin HEAD:ux/shared-api-error-contract
