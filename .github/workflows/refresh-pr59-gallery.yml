name: Refresh PR 59 governed gallery

on:
  push:
    branches:
      - ux/actionable-empty-states

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/actionable-empty-states
      - name: Download exact governed gallery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/agustealo/Mi-Llama/actions/artifacts/11000659171/zip > /tmp/gallery.zip
          rm -rf /tmp/gallery
          mkdir -p /tmp/gallery
          unzip -q /tmp/gallery.zip -d /tmp/gallery
          find /tmp/gallery -maxdepth 2 -type f -name '*.png' -print
          for name in 01-overview.png 02-library.png 03-research.png 04-notebook.png 05-manuscript.png 06-intelligence.png; do
            src="$(find /tmp/gallery -type f -name "$name" -print -quit)"
            test -n "$src"
            cp "$src" "docs/assets/screenshots/$name"
          done
      - name: Commit governed images and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-pr59-gallery.yml
          git add docs/assets/screenshots/*.png
          git commit -m "Refresh governed product gallery for actionable shell"
          git push origin HEAD:ux/actionable-empty-states
