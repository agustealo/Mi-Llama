name: Apply project-aware surface wiring

on:
  push:
    branches:
      - ux/project-aware-surfaces

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/project-aware-surfaces
          fetch-depth: 0
      - name: Patch wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          studio_path = Path('src/mi_llama/workspace_assets/studio.js')
          studio = studio_path.read_text()

          old = "import { bindTextareaEditor, clearEditorAdapter, documentStateForText, getEditorAdapter } from './editor_adapter.js'\n"
          new = old + "import { emptyProjectSurfaceState, loadProjectSurfaceState, renderProjectSurface } from './studio_surfaces.js'\n"
          assert studio.count(old) == 1
          studio = studio.replace(old, new)

          old = "  outline: [],\n  draft: null,\n"
          new = "  outline: [],\n  surface: emptyProjectSurfaceState(),\n  draft: null,\n"
          assert studio.count(old) == 1
          studio = studio.replace(old, new)

          old = "  state.outline = []\n  state.draft = null\n"
          new = "  state.outline = []\n  state.surface = emptyProjectSurfaceState()\n  state.draft = null\n"
          assert studio.count(old) >= 2
          studio = studio.replace(old, new, 1)

          old = "  state.outline = []\n  state.draft = null\n  state.localText = ''\n"
          new = "  state.outline = []\n  state.surface = emptyProjectSurfaceState()\n  state.draft = null\n  state.localText = ''\n"
          assert studio.count(old) == 1
          studio = studio.replace(old, new)

          old = "  if (!state.projectId || !state.auth?.signedIn) return\n\n  const [documents, outline] = await Promise.all([\n    apiJson(`/api/projects/${state.projectId}/writing/documents`),\n    apiJson(`/api/projects/${state.projectId}/writing/outline`),\n  ])\n  state.documents = documents\n"
          new = "  if (!state.projectId || !state.auth?.signedIn) return\n\n  const projectId = state.projectId\n  const surfacePromise = loadProjectSurfaceState(apiJson, projectId)\n  const [documents, outline] = await Promise.all([\n    apiJson(`/api/projects/${projectId}/writing/documents`),\n    apiJson(`/api/projects/${projectId}/writing/outline`),\n  ])\n  if (state.projectId !== projectId) return\n  state.documents = documents\n"
          assert studio.count(old) == 1
          studio = studio.replace(old, new)

          old = "  if (state.documentId) await loadDocumentDraft()\n}\n\nasync function revisionSeed(document) {\n"
          new = "  if (state.documentId) await loadDocumentDraft()\n  const surface = await surfacePromise\n  if (state.projectId !== projectId) return\n  state.surface = surface\n}\n\nasync function revisionSeed(document) {\n"
          assert studio.count(old) == 1
          studio = studio.replace(old, new)

          marker = "function bindShellActions() {\n"
          assert studio.count(marker) == 1
          insert = '''async function reloadProjectSurfaceState() {\n  const projectId = state.projectId\n  if (!projectId) return\n  const surface = await loadProjectSurfaceState(apiJson, projectId)\n  if (state.projectId !== projectId) return\n  state.surface = surface\n  enhanceCurrentView()\n}\n\nasync function uploadProjectSource(file) {\n  const projectId = state.projectId\n  if (!projectId || !state.auth) return\n  const body = new FormData()\n  body.append('file', file, file.name)\n  const response = await state.auth.apiFetch(`/api/projects/${projectId}/sources`, {\n    method: 'POST',\n    body,\n  })\n  if (!response.ok) {\n    await readJson(response)\n    throw new AuthError(apiErrorMessage(response.status), response.status)\n  }\n}\n\nasync function createSurfaceQuestion(question) {\n  const projectId = state.projectId\n  if (!projectId) return\n  await apiJson(`/api/projects/${projectId}/research/questions`, {\n    method: 'POST',\n    body: JSON.stringify({ question, priority: 3 }),\n  })\n}\n\nasync function createSurfaceNote({ title, body }) {\n  const projectId = state.projectId\n  if (!projectId) return\n  await apiJson(`/api/projects/${projectId}/research/notes`, {\n    method: 'POST',\n    body: JSON.stringify({ title, body, kind: 'note' }),\n  })\n}\n\nfunction renderCurrentProjectSurface(view) {\n  const project = state.projects.find((item) => item.id === state.projectId) || null\n  renderProjectSurface({\n    view,\n    signedIn: Boolean(state.auth?.signedIn),\n    signInUnavailable: !state.auth && Boolean(state.authError),\n    project,\n    documents: state.documents,\n    documentId: state.documentId,\n    outline: state.outline,\n    localText: state.localText,\n    surface: state.surface,\n    content: $('#content'),\n    actions: {\n      signIn: openAuthDialog,\n      reload: reloadProjectSurfaceState,\n      uploadSource: uploadProjectSource,\n      createQuestion: createSurfaceQuestion,\n      createNote: createSurfaceNote,\n    },\n  })\n}\n\n'''
          studio = studio.replace(marker, insert + marker)

          old = "function enhanceCurrentView() {\n  syncShell()\n  if (currentView() === 'manuscript') renderManuscriptStudio()\n}\n"
          new = "function enhanceCurrentView() {\n  syncShell()\n  const view = currentView()\n  if (view === 'manuscript') renderManuscriptStudio()\n  else if (['overview', 'library', 'research', 'notebook'].includes(view)) {\n    renderCurrentProjectSurface(view)\n  }\n}\n"
          assert studio.count(old) == 1
          studio = studio.replace(old, new)
          studio_path.write_text(studio)

          auth_path = Path('src/mi_llama/workspace_assets/auth.js')
          auth = auth_path.read_text()
          old = "    if (options.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json')\n"
          new = "    const bodyIsFormData = typeof FormData !== 'undefined' && options.body instanceof FormData\n    if (options.body && !bodyIsFormData && !headers.has('Content-Type')) {\n      headers.set('Content-Type', 'application/json')\n    }\n"
          assert auth.count(old) == 1
          auth_path.write_text(auth.replace(old, new))
          PY

          rm -f .github/workflows/patch-project-aware-surfaces.yml
          rm -f .github/workflows/apply-project-aware-wiring.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wire project-aware consumer surfaces"
          git push origin HEAD:ux/project-aware-surfaces
